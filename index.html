<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leitor de Presença (Crachás)</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* Fundo escuro para poupar bateria e não ofuscar */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #ui-container {
            text-align: center;
            z-index: 10;
        }

        /* O vídeo fica escondido rodando em background para processamento, 
           mas podemos mostrá-lo levemente translúcido se quiser feedback visual */
        #video-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3; /* Muito escuro, pois você disse que não quer feedback visual na tela */
            z-index: 1;
        }

        #start-btn {
            background-color: #d97725; /* Cor padrão da empresa baseada nos crachás */
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 119, 37, 0.4);
            transition: transform 0.1s;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        #status-text {
            margin-top: 20px;
            font-size: 18px;
            color: #aaaaaa;
        }

        #ultimo-registro {
            margin-top: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }

        /* Canvas invisível usado pelo jsQR para processar a imagem da câmera */
        #canvas-processamento {
            display: none; 
        }
    </style>
    
    <!-- Biblioteca externa super leve para ler o QR Code da imagem -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>

    <video id="video-preview" playsinline muted hidden></video>
    <canvas id="canvas-processamento"></canvas>

    <div id="ui-container">
        <!-- O botão é OBRIGATÓRIO porque navegadores bloqueiam câmera e áudio sem clique do usuário -->
        <button id="start-btn">INICIAR LEITORA</button>
        <div id="status-text">Aguardando início...</div>
        <div id="ultimo-registro"></div>
    </div>

    <script>
        let streamOriginal = null;
        let trackCamera = null;
        let canvasElement = document.getElementById("canvas-processamento");
        let canvas = canvasElement.getContext("2d");
        let video = document.getElementById("video-preview");
        let btnStart = document.getElementById("start-btn");
        let statusText = document.getElementById("status-text");
        let textUltimoRegistro = document.getElementById("ultimo-registro");
        
        let processandoQR = false;
        
        // Banco de dados em memória (quem já passou)
        const registrosPresentes = new Set();
        
        // Configuração de Áudio (Sintetizador no Navegador)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function tocarSom(frequencia, tipo, duracao, delayIncial = 0) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = tipo; // 'sine', 'square', 'sawtooth', 'triangle'
            oscillator.frequency.setValueAtTime(frequencia, audioCtx.currentTime + delayIncial);
            
            // Envelope de volume (começa alto, decai rápido para não dar 'estalo')
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime + delayIncial);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delayIncial + duracao);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(audioCtx.currentTime + delayIncial);
            oscillator.stop(audioCtx.currentTime + delayIncial + duracao);
        }

        function somCheckPositivo() {
            // Um som alegre de sucesso (Arpejo rápido: Dó - Mi)
            tocarSom(523.25, 'sine', 0.15, 0);       // C5
            tocarSom(659.25, 'sine', 0.25, 0.1);     // E5
        }

        function somJaRegistrado() {
            // Um som neutro/baixo, apenas indicando que leu, mas já existia.
            tocarSom(300, 'triangle', 0.3, 0);       // Som opaco e único
        }

        async function piscarFlashRapido() {
            if (!trackCamera) return;
            
            try {
                // Verifica se a câmera traseira tem suporte a lanterna (flash)
                const capacidades = trackCamera.getCapabilities();
                if (capacidades.torch) {
                    // Liga o flash
                    await trackCamera.applyConstraints({ advanced: [{ torch: true }] });
                    
                    // Desliga muito rápido (100 milissegundos) para servir de "feedback visual"
                    setTimeout(async () => {
                        try {
                            await trackCamera.applyConstraints({ advanced: [{ torch: false }] });
                        } catch(e) { /* ignora erro ao desligar */ }
                    }, 100); 
                }
            } catch (erro) {
                console.log("Aparelho/Navegador não suporta controle de Flash.", erro);
            }
        }

        function escanearContinuamente() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                
                // Desenha o frame do vídeo no canvas invisível
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                
                // Extrai a imagem
                var imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                
                // Passa pelo jsQR
                var codigo = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (codigo && !processandoQR) {
                    // Encontrou um QR!
                    processandoQR = true; 
                    registrarPresenca(codigo.data);
                    
                    // Trava de 2 segundos para não ler o mesmo crachá 60 vezes por segundo
                    setTimeout(() => { processandoQR = false; }, 2000); 
                }
            }
            requestAnimationFrame(escanearContinuamente);
        }

        function registrarPresenca(idColaborador) {
            // Pisca o flash da câmera!
            piscarFlashRapido();

            // Pega apenas a matrícula, removendo sujeiras se houver
            let matricula = idColaborador.trim().toUpperCase();

            // Verifica se já passou hoje
            if (registrosPresentes.has(matricula)) {
                somJaRegistrado();
                textUltimoRegistro.style.color = "#aaaaaa";
                textUltimoRegistro.innerText = `Re-lido: ${matricula}`;
                console.log("Já registrado:", matricula);
            } else {
                somCheckPositivo();
                registrosPresentes.add(matricula);
                textUltimoRegistro.style.color = "#4CAF50"; // Verde
                textUltimoRegistro.innerText = `✅ Sucesso: ${matricula}`;
                console.log("Novo registro:", matricula);
            }
        }

        btnStart.addEventListener("click", async () => {
            try {
                // Inicia o contexto de áudio agora que o usuário clicou (Políticas de segurança do Chrome)
                if (!audioCtx) {
                    audioCtx = new AudioContext();
                }

                btnStart.innerText = "Conectando Câmera...";
                
                // Pede a câmera estritamente traseira ("environment")
                const constraints = {
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                };

                streamOriginal = await navigator.mediaDevices.getUserMedia(constraints);
                trackCamera = streamOriginal.getVideoTracks()[0];
                
                video.srcObject = streamOriginal;
                video.setAttribute("playsinline", true); // Necessário para iOS
                video.hidden = false;
                video.play();

                btnStart.style.display = "none";
                statusText.innerText = "Câmera ativa. Escaneando crachás...";

                // Inicia o loop de análise de vídeo
                requestAnimationFrame(escanearContinuamente);

            } catch (erro) {
                console.error("Erro na Câmera:", erro);
                // Fallback: Tenta pegar qualquer câmera se o celular não informar que tem "traseira"
                if (erro.name === "OverconstrainedError") {
                   statusText.innerText = "Câmera traseira específica não encontrada. Tentando câmera padrão...";
                   tentaCameraAlternativa();
                } else {
                   statusText.innerText = "Erro ao acessar câmera: Permissão Negada ou Indisponível.";
                   btnStart.innerText = "Tentar Novamente";
                }
            }
        });

        async function tentaCameraAlternativa() {
             try {
                streamOriginal = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                trackCamera = streamOriginal.getVideoTracks()[0];
                video.srcObject = streamOriginal;
                video.setAttribute("playsinline", true);
                video.hidden = false;
                video.play();
                
                btnStart.style.display = "none";
                statusText.innerText = "Câmera secundária ativa. Escaneando...";
                requestAnimationFrame(escanearContinuamente);
             } catch(e) {
                 statusText.innerText = "Nenhuma câmera traseira funcionou.";
             }
        }
    </script>
</body>
</html>
